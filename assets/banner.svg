<g><title>Goal 6: Clean water and sanitation</title><rect x="380" y="212" width="56" height="56" rx="6" fill="#26BDE2"/><text x="408" y="249" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">6</text></g>
