<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Open Problems</title>
<desc id="d">The UN Sustainable Development Goals as open-source tasks. A row of 17 numbered squares in the goal colours.</desc>
<rect width="100%" height="100%" rx="16" fill="#0f1b2d"/>
<text x="600" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Open Problems</text>
<text x="600" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9d4e3">The UN Sustainable Development Goals as open-source tasks</text>
