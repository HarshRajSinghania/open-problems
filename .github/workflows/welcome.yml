name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome, and thanks for opening your first issue here! 👋

            A maintainer will reply soon. Meanwhile:
            - [CONTRIBUTING.md](https://github.com/harrythentrepreneur/open-problems/blob/main/CONTRIBUTING.md) explains how tasks work.
            - To take a task, comment `/assign` on it.
            - Questions are welcome in [Discussions](https://github.com/harrythentrepreneur/open-problems/discussions).
          pr-message: |
            Thanks for your first pull request! 🎉

            A maintainer will review it soon. Please check:
            - Every commit is signed off (`git commit -s`).
            - You ran `python tools/check_problems.py` if you changed a `problem.md`.
            - Sources are linked for every fact or number.

            See [CONTRIBUTING.md](https://github.com/harrythentrepreneur/open-problems/blob/main/CONTRIBUTING.md) for details.
