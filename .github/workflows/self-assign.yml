name: Self-assign

# Comment "/assign" on an issue to take it, "/unassign" to give it back.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/assign') ||
       startsWith(github.event.comment.body, '/unassign'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const user = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const base = { owner: context.repo.owner, repo: context.repo.repo,
                           issue_number: issue.number };
            const others = (issue.assignees || [])
              .map(a => a.login).filter(l => l !== user);
            const say = (text) =>
              github.rest.issues.createComment({ ...base, body: text });
            const removeLabel = async (name) => {
              try { await github.rest.issues.removeLabel({ ...base, name }); }
              catch (e) { if (e.status !== 404) throw e; }
            };

            if (/^\/unassign\b/.test(body)) {
              if (!(issue.assignees || []).some(a => a.login === user)) {
                return say(`@${user} you are not assigned to this issue.`);
              }
              await github.rest.issues.removeAssignees({ ...base, assignees: [user] });
              if (others.length === 0) {
                await removeLabel('status: in progress');
                await github.rest.issues.addLabels({ ...base, labels: ['status: ready'] });
              }
              return say(`Thanks @${user}, you are unassigned. The task is open for someone else.`);
            }

            if (!/^\/assign\b/.test(body)) return;
            if (issue.state !== 'open') {
              return say(`@${user} this issue is closed, so it cannot be assigned.`);
            }
            if (others.length > 0) {
              return say(`@${user} this task is already taken by ` +
                others.map(o => '@' + o).join(', ') +
                '. Ask them here if you want to help, or pick another ' +
                '[good first issue](https://github.com/' + context.repo.owner +
                '/' + context.repo.repo + '/labels/good%20first%20issue).');
            }
            await github.rest.issues.addAssignees({ ...base, assignees: [user] });
            await removeLabel('status: ready');
            await github.rest.issues.addLabels({ ...base, labels: ['status: in progress'] });
            return say(`Thanks @${user}, this task is yours! 🎉\n\n` +
              '- Read [CONTRIBUTING.md](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/CONTRIBUTING.md) if you have not yet.\n' +
              '- Post a short update here at least every 14 days, or the task may be freed.\n' +
              '- Comment `/unassign` if you need to stop. That is fine.');
